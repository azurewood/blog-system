# fly.toml app configuration file generated for blog-sys-api on 2026-02-03T03:08:06+13:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blog-sys-api'
primary_region = 'syd'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
